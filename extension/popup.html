<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Clockwise</title>
  <link rel="stylesheet" href="fonts/fonts.css">
  <style>
    :root { color-scheme: light; --page:#f3e8d6; --card:#fdf8ee; --ink:#2b1d3f; --ink-2:#5f5070; --border:#e4d3b4; --accent:#5b3a91; --ok:#2f7a2f; --rec:#c0392b; --warn:#b07800;
      font-family: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif; }
    /* Dark is the default look, like the dashboard. */
    :root:not([data-theme="light"]) { color-scheme: dark; --page:#1a1324; --card:#261c33; --ink:#f3eadb; --ink-2:#cdbfda; --border:rgba(243,234,219,.13); --accent:#7a55c7; --ok:#6cc36c; --rec:#f08a80; --warn:#f0bf4c; }
    [hidden] { display: none !important; }
    body { margin: 0; width: 320px; background: var(--page) url("images/background-tile.webp") 0 0 / 627px auto repeat; color: var(--ink); font-size: 14px; line-height: 1.45; }
    .wrap { padding: 16px; display: grid; gap: 12px; }
    .brand { display: flex; align-items: center; gap: 8px; }
    h1 { font-family: "Fraunces", Georgia, serif; font-variation-settings: 'SOFT' 50; font-size: 24px; font-weight: 650; letter-spacing: -0.01em; margin: 0; line-height: 1; }
    .logo { display: block; }
    .i-dot { position: relative; }
    .i-dot::after { content: ""; position: absolute; left: 50%; top: .2em; width: .21em; height: .21em; transform: translateX(-50%); border-radius: 50%; background: #e3a92c; }
    .status { display: flex; align-items: flex-start; gap: 9px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #9a8da8; flex: none; margin-top: 6px; }
    .dot.live { background: var(--ok); }
    .dot.rec { background: var(--rec); box-shadow: 0 0 0 4px color-mix(in srgb, var(--rec) 22%, transparent); }
    .dot.err { background: var(--warn); }
    .muted { color: var(--ink-2); }
    .community { display: grid; gap: 8px; background: var(--card); border: 1.5px solid var(--border); border-radius: 24px; padding: 14px 16px; }
    .community label { font-family: "Fraunces", Georgia, serif; font-variation-settings: 'SOFT' 50; font-weight: 600; font-size: 16px; }
    .choices { display: inline-flex; gap: 2px; padding: 4px; background: var(--card); border: 1.5px solid var(--border); border-radius: 999px; justify-self: start; }
    .choice { font: inherit; font-weight: 600; color: var(--ink-2); background: none; border: 0; border-radius: 999px; padding: 7px 18px; cursor: pointer; }
    .choice[aria-pressed="true"] { background: var(--ink); color: var(--card); }
    .community .note { font-size: 12.5px; }
    .linkish { background: none; border: 0; padding: 0; color: inherit; text-decoration: underline; cursor: pointer; font: inherit; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .stat { background: var(--card); border: 1.5px solid var(--border); border-radius: 22px; padding: 10px 12px; }
    .stat b { display: block; font-size: 22px; font-weight: 700; }
    #open { font: inherit; font-weight: 700; padding: 10px; border-radius: 999px; border: 0; background: var(--accent); color: #fff; cursor: pointer; }
    #open:hover { filter: brightness(1.08); }
    .choices { flex-wrap: wrap; border-radius: 22px; }
    #main { display: grid; gap: 12px; }
    .account { font-size: 13px; color: var(--ink-2); }
    .account b { color: var(--ink); }
    .gate { display: grid; gap: 12px; }
    .gate p { margin: 0; }
    .gate form { display: grid; gap: 8px; }
    .gate input { font: inherit; font-size: 14px; padding: 10px 14px; border-radius: 999px; border: 1.5px solid var(--border); background: var(--card); color: var(--ink); outline: none; }
    .gate input:focus { border-color: var(--accent); }
    .btn { font: inherit; font-weight: 700; padding: 10px 16px; border-radius: 999px; border: 0; cursor: pointer; }
    .btn.primary { background: var(--accent); color: #fff; }
    .btn:disabled { opacity: .6; }
    .msg { color: var(--rec); font-size: 12.5px; }
    .msg:empty { display: none; }
    .small { font-size: 12.5px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand"><img class="logo" src="icons/logo-dark.png" alt="" width="30" height="30"><h1 aria-label="Clockwise"><span aria-hidden="true">Clockw<span class="i-dot">ı</span>se</span></h1></div>
    <!-- First use: sign in (or create an account) once; the extension stays signed in after that. -->
    <div class="gate" id="gate" hidden>
      <p class="muted">Sign in once to start. You'll stay signed in on this browser.</p>
      <div class="choices" role="group" aria-label="Sign in or create an account">
        <button class="choice" data-gate-mode="signin" aria-pressed="true">Sign in</button><button class="choice" data-gate-mode="signup" aria-pressed="false">Create account</button>
      </div>
      <form id="signin">
        <input name="username" placeholder="Username" autocomplete="username" required aria-label="Username">
        <input name="password" type="password" placeholder="Password" autocomplete="current-password" required aria-label="Password">
        <input name="confirm" type="password" placeholder="Password again" autocomplete="new-password" aria-label="Password again" data-signup hidden>
        <input name="community" type="password" placeholder="Community password" aria-label="Community password" data-signup hidden>
        <button type="submit" class="btn primary" id="gate-submit">Sign in</button>
        <span class="msg" id="signin-msg" role="alert"></span>
        <span class="muted small" data-signin-only>Forgot your password? Ask an editor to set a new one.</span>
      </form>
    </div>
    <div id="main" hidden>
    <div class="status"><span class="dot" id="dot"></span><span id="status">Checking…</span></div>
    <div class="community" id="community-box" hidden>
      <label>Community for room “<span id="room"></span>”</label>
      <div class="choices" id="community" role="group" aria-label="Community"></div>
      <span class="note muted" id="community-note"></span>
    </div>
    <div class="stats">
      <div class="stat"><b id="games">–</b><span class="muted" id="games-label">games recorded</span></div>
      <div class="stat"><b id="last">–</b><span class="muted">last game</span></div>
    </div>
    <button id="open">Open dashboard</button>
    <div class="account" id="acct-in" hidden>Signed in as <b id="acct-name"></b> · <button class="linkish" id="signout">Sign out</button></div>
    </div>
  </div>
  <script type="module" src="src/popup.js"></script>
</body>
</html>
