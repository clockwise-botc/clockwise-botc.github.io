<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clockwise</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="icons/icon-32.png">
  <link rel="stylesheet" href="dashboard.css?v=f648e9c783">
</head>
<body>
  <!-- The curve token names run along (same as botc.app's), shared by every token on the page. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><path id="ct-circle" d="M 70 70 m -42.4264 -42.4264 a 60 60 315 1 0 84.8528 84.8528 a 60 60 315 1 0 -84.8528 -84.8528"/></defs></svg>
  <header class="top">
    <a class="brand" href="./" title="Back to the main page">
      <img class="logo" src="icons/logo-dark.png" alt="" width="40" height="40">
      <h1 aria-label="Clockwise"><span aria-hidden="true">Clockw<span class="i-dot">ı</span>se</span></h1>
    </a>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="stats">Community</button>
      <button role="tab" data-tab="me">My stats</button>
      <button role="tab" data-tab="games">Games</button>
      <button role="tab" data-tab="data">Settings</button>
    </nav>
  </header>

  <section class="filters" id="filters" aria-label="Filters">
    <div class="filter-row">
      <!-- Which Community view: the overview, or playstyles (which has fewer filters). Tabs on the left, filters on the right. -->
      <div class="view-tabs" id="stats-view" role="tablist" aria-label="Community view">
        <button type="button" role="tab" data-stats-view="stats">Overview</button>
        <button type="button" role="tab" data-stats-view="styles">Playstyles</button>
      </div>
      <div class="filter-set">
        <!-- Clear comes first, so showing it doesn't move the filters (they're aligned right). -->
        <button class="btn clear" id="clear-sel" hidden>Clear</button>
        <div id="community-filter"></div>
        <select data-filter="script" aria-label="Script"></select>
        <select data-filter="storyteller" aria-label="Storyteller"></select>
        <div data-ms="players"></div>
        <div data-ms="characters"></div>
        <div data-ms="types"></div>
      </div>
    </div>
  </section>

  <p class="update-banner" id="update-banner" hidden></p>
  <!-- What shows until the games are in: the Community tab's loading skeleton (dashboard.js skeleton('stats')). -->
  <main id="view">
    <div class="loader" data-tab="stats" role="status"><span class="sr-only">Loading the games…</span>
      <div class="tiles"><div class="card skel" style="height:167px"></div><div class="card skel" style="height:167px"></div><div class="card skel" style="height:167px"></div></div>
      <div class="tiles"><div class="card skel" style="height:167px"></div><div class="card skel" style="height:167px"></div><div class="card skel" style="height:167px"></div></div>
      <div class="grid two"><div class="card skel" style="height:403px"></div><div class="card skel" style="height:403px"></div><div class="card skel" style="height:403px"></div><div class="card skel wide" style="height:328px"></div><div class="card skel" style="height:328px"></div><div class="card skel" style="height:338px"></div><div class="card skel" style="height:338px"></div><div class="card skel" style="height:338px"></div><div class="card skel" style="height:317px"></div><div class="card skel" style="height:317px"></div><div class="card skel" style="height:317px"></div><div class="card skel" style="height:402px"></div><div class="card skel wide" style="height:402px"></div></div>
    </div>
  </main>
  <div id="tooltip" role="tooltip" hidden></div>
  <script src="web-config.js?v=f648e9c783"></script>
  <script type="module" src="src/dashboard.js?v=f648e9c783"></script>
</body>
</html>
